name: cc-our-story

services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - ourstory_data:/data
    restart: unless-stopped
    healthcheck:
      # /healthz 只探一下数据库连不连得上，不渲染页面，比探首页省得多
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  # 数据库、附件、密钥和站点配置都在这里。删掉它等于清空整个站点
  ourstory_data:
